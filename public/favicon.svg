<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="50%" stop-color="#9d55ff" />
      <stop offset="100%" stop-color="#ff5c8a" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />

  <!-- Inner Subtle Glow Frame -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />

  <!-- Sound Waves (Left & Right) -->
  <path d="M28 50 C24 58, 24 66, 28 74" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M100 50 C104 58, 104 66, 100 74" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M20 44 C14 56, 14 68, 20 80" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
  <path d="M108 44 C114 56, 114 68, 108 80" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />

  <!-- Microphone Capsule -->
  <rect x="52" y="26" width="24" height="42" rx="12" fill="url(#micGrad)" filter="url(#glow)" />
  
  <!-- Mic Grille Line Detail -->
  <path d="M52 46 L76 46" stroke="#9d55ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <path d="M56 36 L72 36" stroke="#9d55ff" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Microphone U-Holder (Bracket) -->
  <path d="M42 48 C42 66, 86 66, 86 48" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- Mic Base Stand -->
  <line x1="64" y1="71" x2="64" y2="86" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="48" y1="88" x2="80" y2="88" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />

  <!-- AI Sparkle / Star (Top Right) -->
  <path d="M92 24 Q92 32 100 32 Q92 32 92 40 Q92 32 84 32 Q92 32 92 24 Z" fill="#ffd15c" />
</svg>
